name: Build committed binaries

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "bin/peeragent"
      - "skills/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".mcp*.json"
      - "scripts/package-plugin.sh"
      - "scripts/build-committed.sh"
      - ".github/workflows/build-binaries.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "bin/peeragent"
      - "skills/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".mcp*.json"
      - "scripts/package-plugin.sh"
      - "scripts/build-committed.sh"
      - ".github/workflows/build-binaries.yml"
  workflow_dispatch:

# Only the latest run per ref proceeds; a newer source push cancels an in-flight
# build so we never commit binaries built from superseded source.
concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  SIZE_BUDGET_BYTES: 8388608 # 8 MB per binary

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify committed plugin/ curated tree is in sync
        run: |
          scripts/package-plugin.sh
          if ! git diff --exit-code -- \
            plugin/.claude-plugin plugin/.codex-plugin plugin/.mcp.claude.json \
            plugin/.mcp.codex.json plugin/skills plugin/bin/peeragent; then
            echo "committed plugin/ curated tree is stale; run scripts/package-plugin.sh and commit plugin/" >&2
            exit 1
          fi
      - name: Cross-build committed binaries
        run: scripts/build-committed.sh
      - name: Commit refreshed binaries
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin/bin
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh committed peeragent binaries [skip ci]"
          if git push; then
            exit 0
          fi
          # main advanced under us; rebase, REBUILD from the now-current source so
          # committed binaries always match the pushed source, then retry once.
          echo "push rejected; rebasing on origin/${GITHUB_REF_NAME} and rebuilding"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          scripts/build-committed.sh
          git add plugin/bin
          git commit --amend --no-edit
          git push
